# ---------------------------------------------------------------------------
# Deux Services vers le MÊME pod, et c'est tout l'intérêt.
#
# Le jour annoncé est arrivé : l'authentification humaine passe par le side-car
# oauth2-proxy, et le Service `infomaniak-domains` vise désormais SON port. Si
# l'Ingress du connecteur visait encore ce Service, les huit chemins machine se
# retrouveraient DERRIÈRE l'authentification humaine — Claude, qui appelle
# depuis le cloud sans navigateur, recevrait une page HTML vers Google là où il
# attend du JSON, et ne pourrait plus jamais se connecter.
#
# Les avoir séparés d'avance fait que la bascule n'a touché qu'un seul Service,
# et que check_frontiere.sh dit immédiatement si elle a débordé.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: infomaniak-domains
spec:
  type: ClusterIP
  selector:
    app: infomaniak-domains
  ports:
    - port: 80
      # 4180, et non 8080 : c'est le side-car oauth2-proxy qui répond ici, et
      # qui relaie vers l'application une fois l'utilisateur revenu de Google.
      # `/oauth2/start` et `/oauth2/callback` sont servis par lui, sans jamais
      # atteindre l'application — c'est pour ça qu'ils n'ont aucune route.
      targetPort: 4180
      protocol: TCP
---
# Le MÊME pod, nommé séparément : la porte de Claude, qui n'a pas de navigateur.
# Elle garde 8080, c'est-à-dire l'application en direct, sans le side-car. Ce
# port-ci est la ligne qu'il ne faut jamais aligner sur celui d'au-dessus « par
# cohérence » : les deux Services diffèrent exprès, et c'est leur seule
# différence.
apiVersion: v1
kind: Service
metadata:
  name: infomaniak-domains-direct
spec:
  type: ClusterIP
  selector:
    app: infomaniak-domains
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
# ---------------------------------------------------------------------------
# Le Basic Auth — GARDÉ EN PLACE, ET INERTE.
#
# Plus aucune route ne le référence : l'authentification humaine est passée au
# compte Google, dans le side-car. Cet objet ne fait donc rien aujourd'hui, et
# c'est exactement pour ça qu'il reste — un middleware qu'on supprime est un
# retour arrière qu'on doit réécrire sous la pression, le soir où Google, le
# client OAuth ou la liste nominative pose un problème.
#
# Le retour arrière, honnêtement : DEUX commandes, pas une.
#
#   M=infomaniak-domains-default-infomaniak-domains
#   kubectl -n infomaniak-domains-default patch svc infomaniak-domains \
#     --type=json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":8080}]'
#   kubectl -n infomaniak-domains-default annotate ingress infomaniak-domains --overwrite \
#     "traefik.ingress.kubernetes.io/router.middlewares=$M-auth@kubernetescrd,$M-marque@kubernetescrd"
#
# La première seule laisserait le proxy Google devant sans que Traefik demande
# quoi que ce soit ; la seconde seule empilerait le mot de passe DEVANT Google
# au lieu de le remplacer. Et l'une comme l'autre est défaite au prochain
# `./deploy.sh` : le dépôt est la source de vérité, donc un retour arrière qui
# doit durer se commite ici.
#
# Le Secret infomaniak-domains-basicauth n'est PAS dans ce dépôt.
# Sa création — le mot de passe ne quitte jamais le terminal — est dans
# deploy.sh, qui continue d'exiger ce Secret : un Middleware dont le Secret a
# disparu rend 500, et on l'apprendrait au pire moment, celui du retour arrière.
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: infomaniak-domains-auth
spec:
  basicAuth:
    secret: infomaniak-domains-basicauth
    realm: domaines
---
# ---------------------------------------------------------------------------
# La marque du proxy — le second middleware de l'Ingress humain (dette D1)
# ---------------------------------------------------------------------------
#
# Le Basic Auth prouve « ce navigateur détient le mot de passe ». Il ne prouve
# RIEN sur le chemin emprunté : le pod écoute sur 8080, et tout voisin du
# cluster atteignait /authorize — la page qui émet les codes d'autorisation —
# en le joignant en direct, sans jamais croiser Traefik. `Authorization: Basic`
# et `X-Forwarded-User`, sur lesquels s'appuyait `_humain_present()`, sont des
# en-têtes que l'appelant écrit lui-même.
#
# `serveur.py` compare désormais `X-Infomaniak-Proxy` à `INFOMANIAK_MARQUE_PROXY`
# par `hmac.compare_digest`, et n'accepte QU'UNE occurrence. Ce middleware est
# ce qui produit la marque, et il n'est posé QUE sur l'Ingress humain.
#
# L'objet Middleware lui-même n'est pas dans ce fichier, et ce n'est pas un
# oubli : `customRequestHeaders` ne prend qu'une valeur littérale — Traefik ne
# sait pas lire un Secret pour un en-tête. L'écrire ici mettrait le secret
# partagé dans le dépôt, donc hors d'atteinte de toute rotation. Il est rendu au
# déploiement par `k8s/marque_middleware.py`, depuis le Secret
# `infomaniak-marque-proxy` (clé « marque »), hors dépôt — le MÊME Secret que
# `k8s/deployment.yaml` injecte au conteneur. Une seule source pour les deux
# côtés : ils ne peuvent pas diverger, et tourner la marque la tourne des deux
# côtés à la fois.
#
# CE QUE customRequestHeaders FAIT DE LA COPIE ENTRANTE : il l'ÉCRASE.
# Vérifié dans la source de Traefik (`pkg/middlewares/headers/header.go`, v3.6 :
# `req.Header.Set(header, value)` — `Set` remplace toutes les valeurs, là où
# `Add` en ajouterait une), confirmé par la documentation (« Custom headers will
# overwrite existing headers if they have identical names »), et MESURÉ contre
# le Traefik 3.6.25 de ce cluster le 2026-08-31, sur un pod témoin qui rend les
# occurrences reçues :
#
#   ce que le client envoie          derrière ce middleware   sans middleware
#   -------------------------------  -----------------------  ----------------
#   rien                             1 × la vraie valeur      0 occurrence
#   X-Infomaniak-Proxy: forgé        1 × la vraie valeur      1 × « forgé »
#   deux fois l'en-tête, forgé       1 × la vraie valeur      2 occurrences
#   la vraie valeur, devinée         1 × la vraie valeur      1 occurrence
#
# La colonne de droite est ce qui rend nécessaire le refus du doublon côté
# serveur : un client PEUT envoyer deux occurrences. Traefik les réduit à une —
# mais si une version future ajoutait au lieu d'écraser, `serveur.py` refuserait
# la requête (len != 1) au lieu de lire la copie hostile arrivée en tête. La
# mauvaise configuration se verrait ; elle ne s'exploiterait pas.
#
# IL N'Y A PLUS QU'UN MIDDLEWARE, et l'ancien ordre mérite d'être expliqué
# plutôt qu'effacé : `-auth` venait d'abord pour qu'une requête sans mot de
# passe soit renvoyée avant que la marque ne soit posée. Le refus a déménagé
# dans le pod — oauth2-proxy renvoie vers Google avant de relayer quoi que ce
# soit à l'application — donc Traefik marque désormais aussi des requêtes qui
# n'aboutiront pas. Ça ne coûte qu'un en-tête posé pour rien : la marque dit
# « cette requête a traversé Traefik par la porte humaine », ce qui reste vrai,
# et elle n'a jamais prétendu dire qui était derrière.
#
# SI LE MIDDLEWARE MANQUE : Traefik rend 500 sur les routes humaines. C'est
# fail-closed, et c'est voulu — appliquer ce fichier à la main sans passer par
# `deploy.sh` ferme le site, il ne l'ouvre pas sans marque.
# ---------------------------------------------------------------------------
# L'Ingress humain : tout le reste du site, derrière le compte Google (dans le
# pod, via le Service qui vise le side-car) ET la marque (ici).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infomaniak-domains
  annotations:
    # L'issuer vit ICI et nulle part ailleurs. Deux Ingress porteurs d'un issuer
    # sur un même hôte font deux commandes Let's Encrypt pour un seul
    # certificat, donc deux fois le quota pour rien.
    cert-manager.io/issuer: letsencrypt
    # PLUS DE `-auth` : le mot de passe partagé a cédé la place au compte
    # Google. Le Middleware existe toujours, inerte — voir son en-tête, plus
    # haut, pour le retour arrière.
    #
    # `-marque` reste, et il reste SEUL sur cette ligne. C'est lui qui distingue
    # « arrivé par Traefik, porte humaine » de « joint en direct sur 8080 par un
    # voisin du cluster » — une distinction que le compte Google ne fait pas :
    # oauth2-proxy est DANS le pod, donc un voisin qui parle au port 8080 ne le
    # croise pas plus qu'il ne croisait le Basic Auth.
    traefik.ingress.kubernetes.io/router.middlewares: infomaniak-domains-default-infomaniak-domains-marque@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - domains.mcp.ephais.eu
      secretName: infomaniak-domains-tls
  rules:
    - host: domains.mcp.ephais.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infomaniak-domains
                port:
                  number: 80
---
# ---------------------------------------------------------------------------
# La frontière du connecteur.
#
# Claude appelle /mcp, /token, /register et les documents de découverte depuis
# le cloud, SANS identifiants Basic. Ces sept chemins — et EUX SEULS — sortent
# donc du middleware d'authentification. Tout le reste (/, /authorize,
# /consent, /healthz) reste derrière.
#
# Un huitième chemin s'y ajoute, pour une raison différente : /_whoami sert
# l'empreinte du code effectivement chargé. Une empreinte qu'on ne peut lire
# qu'avec le mot de passe est une empreinte lue de l'intérieur — or c'est
# précisément la vue du dehors qui peut mentir, et c'est elle qu'on veut
# confronter au dépôt (dette D12). Il ne rend qu'un condensat : rien qui aide
# à entrer, et tout ce qu'il faut pour savoir ce qui tourne.
#
# pathType: Exact, JAMAIS Prefix. Traefik traduit Prefix en PathPrefix(), qui
# est un préfixe de CHAÎNE et non de segment : exempter « /mcp » en Prefix
# exempterait aussi /mcpXXX, et toute route future sous un chemin exempté
# deviendrait publique en silence. tests/check_frontiere.sh le vérifie depuis
# l'extérieur, sans mot de passe — un `curl -u` ne dirait rien de ce qu'un
# inconnu peut atteindre.
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: infomaniak-domains-mcp-ratelimit
spec:
  rateLimit:
    average: 20
    burst: 40
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: infomaniak-domains-mcp-inflight
spec:
  inFlightReq:
    amount: 20
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infomaniak-domains-mcp
  annotations:
    # PAS de cert-manager.io/issuer ici : le certificat est commandé par
    # l'Ingress humain, sur le même hôte. PAS de -auth non plus : c'est tout
    # l'objet de cet Ingress.
    #
    # PAS de -marque non plus, et c'est la ligne la plus facile à ajouter par
    # mégarde le jour où l'on copiera l'annotation d'à côté. Claude appelle ces
    # huit chemins depuis le cloud, sans mot de passe : les marquer dirait « une
    # présence humaine a traversé le proxy » d'un trafic qui n'a traversé aucune
    # porte humaine. Aucun des huit ne consulte `_humain_present()` aujourd'hui
    # — les quatre routes qui le font sont /, /authorize, /consent et /revoke,
    # toutes servies par l'Ingress humain — donc rien ne s'ouvrirait ce matin.
    # Ce qui s'ouvrirait, c'est plus tard : le jour où une route humaine
    # déménage ici, ou qu'un de ces chemins gagne une vérification humaine, la
    # marque aurait cessé de vouloir dire ce qu'elle dit, sans que rien ne
    # bouge. `tests/check_frontiere.sh` ne peut pas voir ça du dehors — la
    # marque est posée entre Traefik et le pod, invisible depuis Internet. Cette
    # ligne-ci est la seule garde.
    traefik.ingress.kubernetes.io/router.middlewares: infomaniak-domains-default-infomaniak-domains-mcp-ratelimit@kubernetescrd,infomaniak-domains-default-infomaniak-domains-mcp-inflight@kubernetescrd
    # Priorité explicite : Traefik trie par longueur de règle, et l'écart entre
    # Path(/mcp) et PathPrefix(/) est trop serré pour qu'on lui confie la
    # frontière. Si l'Ingress humain gagnait, /mcp repasserait derrière Basic
    # Auth et le connecteur tomberait sans que rien n'ait changé de visible.
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  ingressClassName: traefik
  tls:
    # On s'y réfère seulement : ce secret est rempli par l'Ingress humain, qui
    # porte l'issuer.
    - hosts:
        - domains.mcp.ephais.eu
      secretName: infomaniak-domains-tls
  rules:
    - host: domains.mcp.ephais.eu
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend: {service: {name: infomaniak-domains-direct, port: {number: 80}}}
          - path: /token
            pathType: Exact
            backend: {service: {name: infomaniak-domains-direct, port: {number: 80}}}
          - path: /register
            pathType: Exact
            backend: {service: {name: infomaniak-domains-direct, port: {number: 80}}}
          - path: /.well-known/oauth-protected-resource
            pathType: Exact
            backend: {service: {name: infomaniak-domains-direct, port: {number: 80}}}
          - path: /.well-known/oauth-protected-resource/mcp
            pathType: Exact
            backend: {service: {name: infomaniak-domains-direct, port: {number: 80}}}
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend: {service: {name: infomaniak-domains-direct, port: {number: 80}}}
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend: {service: {name: infomaniak-domains-direct, port: {number: 80}}}
          - path: /_whoami
            pathType: Exact
            backend: {service: {name: infomaniak-domains-direct, port: {number: 80}}}
